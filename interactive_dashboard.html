<!DOCTYPE html><html lang=zh-Hant><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>互動 Dashboard</title><style>:root{--bg:#0b1220;--card:#151e2e;--line:#243044;--text:#e8eef7;--muted:#8b9bb4;--accent:#38bdf8;--good:#34d399;--warn:#fbbf24}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}header{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}header h1{font-size:1.1rem}a{color:var(--accent)}.toolbar{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;background:#0f172a}select,input,button{background:var(--card);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px}button{background:var(--accent);color:#0b1220;font-weight:600;border:none;cursor:pointer}.wrap{max-width:1100px;margin:0 auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}.card:hover{border-color:var(--accent)}.card h3{font-size:1rem}.play{color:var(--accent);font-size:.78rem;margin:4px 0}.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:.7rem}.b-high{background:rgba(52,211,153,.15);color:var(--good)}.b-mid{background:rgba(251,191,36,.15);color:var(--warn)}.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}.panel.active{display:block}table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{border:1px solid var(--line);padding:6px}th{background:#0f172a;color:var(--accent)}.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}.stat{background:#0f172a;border-radius:8px;padding:10px;border:1px solid var(--line)}.stat b{display:block;color:var(--good)}</style></head><body><header><h1>互動 Dashboard</h1><div><a href=/>首頁</a> · <a href=/full_report>報告</a> · <a href=/direct_compare>對照</a></div></header><div class=toolbar><label>產業</label><select id=sector><option value=all>全部</option><option value=finance>金融</option><option value=tech>科技</option><option value=health>醫療</option><option value=retail>零售</option><option value=energy>能源</option><option value=staples>必需</option><option value=industrial>工業</option></select><label>綿延</label><select id=quality><option value=all>全部</option><option value=high>高</option><option value=mid>中</option></select><input id=q placeholder="代碼" style="width:100px"><button onclick="render()">篩選</button></div><div class=wrap><div id=summary class=stat-row></div><div id=cards class=cards></div><div id=detail class=panel></div></div><script>
const DATA=[{t:"V",n:"Visa",s:"finance",play:"支付網路",q:"high",dur:"高",metrics:{"淨營收":"$11.6B +14%","支付量":"+10%","跨境":"+12%"},note:"不放貸；過路費",moat:"網路效應",flag:"監管"},{t:"MA",n:"Mastercard",s:"finance",play:"支付網路",q:"high",dur:"高",metrics:{"淨營收":"$9.3B +14%","增值服務":"+20%"},note:"增值服務更快",moat:"網路效應",flag:"監管"},{t:"JPM",n:"JPMorgan",s:"finance",play:"全能銀行",q:"mid",dur:"中高",metrics:{"ROE":"24%","NII":"+10%"},note:"含一次性需拆核心",moat:"規模",flag:"信用"},{t:"MSFT",n:"Microsoft",s:"tech",play:"雲+軟體",q:"high",dur:"極高",metrics:{"Azure":"+43%","Cloud":"$59.3B"},note:"轉型被驗證",moat:"轉換成本",flag:"Capex"},{t:"AAPL",n:"Apple",s:"tech",play:"硬體+服務",q:"high",dur:"高",metrics:{"營收":"$109.4B +16%","Services":"+12%"},note:"服務穩定器",moat:"生態",flag:"換機"},{t:"GOOGL",n:"Alphabet",s:"tech",play:"廣告+雲",q:"high",dur:"極高",metrics:{"重點":"搜尋/Cloud"},note:"現金牛",moat:"搜尋網路",flag:"AI變現"},{t:"NVDA",n:"NVIDIA",s:"tech",play:"AI基礎設施",q:"mid",dur:"高波動",metrics:{"DC":"$75.2B +92%"},note:"已換賽道",moat:"CUDA",flag:"週期"},{t:"AMZN",n:"Amazon",s:"retail",play:"平台+雲",q:"high",dur:"高(AWS)",metrics:{"AWS":"$42.2B +37%"},note:"利潤看AWS",moat:"AWS",flag:"Capex"},{t:"COST",n:"Costco",s:"retail",play:"會員倉儲",q:"high",dur:"高",metrics:{"續訂":"92.2%","會員費":"+11%"},note:"模式最乾淨",moat:"會員",flag:"估值"},{t:"LLY",n:"Eli Lilly",s:"health",play:"重磅製藥",q:"mid",dur:"高集中",metrics:{"營收":"+48%","Mounjaro":"$9.9B"},note:"成績頂級",moat:"專利",flag:"集中"},{t:"UNH",n:"UnitedHealth",s:"health",play:"管理式醫療",q:"mid",dur:"中高",metrics:{"重點":"成本率"},note:"非製藥語言",moat:"規模",flag:"政策"},{t:"XOM",n:"Exxon",s:"energy",play:"整合油氣",q:"mid",dur:"中",metrics:{"重點":"FCF/股息"},note:"商品β",moat:"成本",flag:"油價"},{t:"NEE",n:"NextEra",s:"energy",play:"公用+再生",q:"mid",dur:"中高",metrics:{"重點":"回報率/利率"},note:"另一賽道",moat:"特許",flag:"利率"},{t:"KO",n:"Coca-Cola",s:"staples",play:"品牌飲料",q:"high",dur:"高",metrics:{"重點":"量價/股息"},note:"經典現金流",moat:"品牌",flag:"健康趨勢"},{t:"CAT",n:"Caterpillar",s:"industrial",play:"設備+服務",q:"mid",dur:"中",metrics:{"重點":"backlog/服務"},note:"服務越重越穩",moat:"經銷",flag:"週期"}];
function badge(q){return q==='high'?'<span class="badge b-high">高</span>':'<span class="badge b-mid">中</span>'}
function render(){const s=document.getElementById('sector').value,q=document.getElementById('quality').value,kw=(document.getElementById('q').value||'').toUpperCase();let list=DATA.filter(d=>(s==='all'||d.s===s)&&(q==='all'||d.q===q)&&(!kw||d.t.includes(kw)||d.n.toUpperCase().includes(kw)));document.getElementById('summary').innerHTML=`<div class=stat><b>${list.length}</b><span>公司</span></div><div class=stat><b>${list.filter(x=>x.q==='high').length}</b><span>綿延高</span></div>`;document.getElementById('cards').innerHTML=list.map(d=>`<div class=card onclick="show('${d.t}')"><h3>${d.t} · ${d.n}</h3><div class=play>${d.play} ${badge(d.q)}</div><div style=font-size:.8rem;color:#8b9bb4>綿延：${d.dur}</div></div>`).join('');document.getElementById('detail').className='panel'}
function show(t){const d=DATA.find(x=>x.t===t);const p=document.getElementById('detail');p.className='panel active';p.innerHTML=`<h2 style=color:var(--accent)>${d.t} · ${d.n}</h2><p>${d.play} · ${d.dur}</p><div class=stat-row>${Object.entries(d.metrics).map(([k,v])=>`<div class=stat><b>${v}</b><span>${k}</span></div>`).join('')}</div><table><tr><th>項目</th><th>內容</th></tr><tr><td>說明</td><td>${d.note}</td></tr><tr><td>護城河</td><td>${d.moat}</td></tr><tr><td>紅旗</td><td>${d.flag}</td></tr></table>`;p.scrollIntoView({behavior:'smooth'})}
render();
</script></body></html>
