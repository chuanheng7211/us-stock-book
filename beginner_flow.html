<!DOCTYPE html><html lang=zh-Hant><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>新手流程</title><style>body{font-family:system-ui;background:#0b1220;color:#e8eef7;padding:20px;line-height:1.6;max-width:720px;margin:0 auto}a{color:#38bdf8}h1{color:#38bdf8}.step{background:#151e2e;border:1px solid #243044;border-radius:12px;padding:14px;margin:12px 0}h2{font-size:1rem;margin-bottom:6px}</style></head><body><h1>新手五步流程</h1><p><a href=/>首頁</a> · <a href=/interactive_dashboard>Dashboard</a></p><div class=step><h2>1. 確認生意類型</h2><p>一句話說它怎麼賺錢。支付？銀行？雲？製藥？會員？</p></div><div class=step><h2>2. 紅旗掃描</h2><p>現金是否跟上利潤、一次性項目、負債、成長是否靠併購。</p></div><div class=step><h2>3. 護城河三問</h2><p>來源？在加強還是削弱？消失後變成什麼？</p></div><div class=step><h2>4. 現況四格</h2><p>需求 / 成本 / 現金 / 市場預期</p></div><div class=step><h2>5. 動作與退出</h2><p>先寫持有理由與退出條件，再決定是否買入。</p></div><p style=color:#8b9bb4;font-size:.85rem>同玩法比較，不要跨產業硬比 PE。</p></body></html>
